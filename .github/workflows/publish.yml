# Publishes kabo-contracts to npmjs.com when a version tag (v1.2.3) is pushed.
# Needs the repository secret NPM_TOKEN (npm granular access token with publish rights).
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # npm provenance: the npm page links the package to this exact commit

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm test

      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
