# Publishes kabo-contracts to npmjs.com when a version tag (v1.2.3) is pushed.
# Authentication: npm trusted publishing (OIDC, no token) once it is set up on npmjs.com for
# bobikoki99/kabo-contracts + publish.yml. Until then the NPM_TOKEN secret is used (first publish only).
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # trusted publishing + provenance (the npm page links the package to this commit)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest   # trusted publishing needs npm 11.5.1 or newer

      - run: npm ci
      - run: npm test

      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}   # ignored once trusted publishing works; delete the secret then
